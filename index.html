  </header>
  <main id="container">
    <!-- <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Shader conversion utility</p>
      <h1 id="page-title">From ShaderToy to ZGameEditor,<br><span>without the busywork.</span></h1>
      <p class="intro">Paste your GLSL shader and generate a project ready for the standalone engine or the <a href="https://www.image-line.com/fl-studio-learning/fl-studio-online-manual/html/plugins/ZGameEditor%20Visualizer.htm" target="_blank" rel="noreferrer">FL Studio ZGameEditor Visualizer</a>.</p>
    </section> -->
    <section id="content" class="workspace" aria-label="Shader converter">
      <div class="editors">
        <section class="editor-card"><div class="editor-header"><div><span class="step">01</span><h2>ShaderToy GLSL</h2></div><span class="filetype">INPUT</span></div><textarea id="inputCode" aria-label="ShaderToy GLSL input" placeholder="Paste ShaderToy GLSL here…" spellcheck="false"></textarea></section>
        <section class="settings-panel" aria-labelledby="configuration-title">
          <header class="section-heading">
            <div><span class="step">02</span><h2 id="configuration-title">Configuration</h2></div>
          </header>
          <div class="settings-grid">
            <div class="template-field"><label for="templateSelect">Project template</label><select id="templateSelect"></select></div>
            <div id="ichannelConfig" class="channel-config"></div>
          </div>
          <footer class="settings-footer">
            <button id="convertButton" type="button">Convert shader <span aria-hidden="true">→</span></button>
            <div id="outputActions" class="output-actions" aria-label="Converted project actions"></div>
          </footer>
        </section>
      </div>
      <textarea id="outputCode" class="converter-output" aria-label="Converted ZGameEditor project" readonly></textarea>
      <div id="notification" class="hidden" role="status" aria-live="polite"></div>
    </section>
  </main>
  <!-- <footer id="footer"><a href="https://github.com/nfxbeats/shadertoy2zge" target="_blank" rel="noreferrer">Source code &amp; documentation ↗</a></footer> -->
  <script src="audio-analysis.js"></script><script src="text-overlay.js"></script><script src="ichannel-mapping.js"></script><script src="script.js"></script>
</body>
</html>
